version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "main"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "ci"
      include: "scope"

  # В DevKit нет runtime-зависимостей и lockfile; блок нужен только для
  # будущих dev-зависимостей и не создаёт PR, пока package.json пуст.
  - package-ecosystem: "npm"
    directory: "/"
    target-branch: "main"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    groups:
      npm-deps:
        patterns: ["*"]
    commit-message:
      prefix: "deps"
      prefix-development: "deps-dev"
      include: "scope"
