name: Validate skills

on:
  push:
    paths:
      - "skills/**"
      - ".github/workflows/skills.yml"
  pull_request:
    paths:
      - "skills/**"
      - ".github/workflows/skills.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          python-version: "3.13"

      - name: Install SkillEvaluator
        run: uv tool install --python 3.13 skillevaluator==1.0.1

      - name: Check OpenCode harness compatibility (advisory)
        run: skillevaluator harness-check ./skills --harness opencode --json harness.json

      - name: Validate schema and quality (gate)
        run: |
          skillevaluator validate ./skills \
            --profile default --tiers 1 --checks schema,quality \
            -c -r json,markdown -o reports --min-score 70

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: skillevaluator-reports
          path: |
            reports/
            harness.json
